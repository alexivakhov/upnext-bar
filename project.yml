# XcodeGen spec. Run `make project` (or `xcodegen generate`) to produce UpNextBar.xcodeproj.
name: UpNextBar

options:
  bundleIdPrefix: com.upnextbar
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "3"
    # Ad-hoc signing for local builds; replace with a Developer ID team for distribution.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  UpNextBar:
    type: application
    platform: macOS
    sources:
      - path: UpNextBar
    info:
      path: UpNextBar/Info.plist
      properties:
        CFBundleDisplayName: UpNext Bar
        # XcodeGen writes "1.0" by default; take the versions from the build settings above.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, uk]
        LSApplicationCategoryType: public.app-category.productivity
        # Menu bar only: no Dock icon, no main menu.
        LSUIElement: true
        NSHumanReadableCopyright: ""
    entitlements:
      path: UpNextBar/UpNextBar.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_NAME: UpNextBar
        PRODUCT_BUNDLE_IDENTIFIER: com.upnextbar.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Only for Release: with ad-hoc signing, library validation would block the test bundle in Debug.
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  UpNextBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: UpNextBarTests
    dependencies:
      - target: UpNextBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.upnextbar.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  UpNextBar:
    build:
      targets:
        UpNextBar: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UpNextBarTests
    archive:
      config: Release
